<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <title>Raízes do Nordeste - Entrar</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <header class="topo">
    <strong>Raízes</strong> <span>do Nordeste</span>
  </header>

  <main class="conteudo conteudo-estreito">
    <h1>Entrar</h1>
    <p class="aviso">Seus dados servem só para login, pedidos e fidelidade.
      <a href="politica.html">Política de Privacidade</a></p>

    <form id="form-login" class="formulario">
      <label for="email">E-mail</label>
      <input type="email" id="email" required>

      <label for="senha">Senha</label>
      <input type="password" id="senha" required>

      <p id="erro-login" class="erro" role="alert"></p>

      <button type="submit" class="botao botao-principal botao-largo">Entrar</button>
    </form>

    <p class="dica">Cliente de teste: cliente@teste.com / senha 123456</p>

    <p>Ainda não tem conta? <a href="cadastro.html">Criar conta</a></p>
    <p><a href="index.html">Trocar unidade</a></p>
  </main>

  <footer class="rodape">
    <a href="ajuda.html">Ajuda</a>
    <a href="politica.html">Política de privacidade</a>
  </footer>

  <script src="js/dados.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
